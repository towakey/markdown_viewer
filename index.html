<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Markdown Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="md.css">
<style>
  main { padding: 24px 32px 64px; background: #fff; min-height: calc(100vh - 49px); box-sizing: border-box; }
</style>
</head>
<body>
<header>
  <span class="title">Markdown Viewer</span>
  <span class="file" id="fileName"></span>
  <span class="grow"></span>
  <button id="openBtn">MDファイルを開く</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</header>
<main id="view"></main>
<script src="md.js"></script>
<script>
"use strict";
// --- 表示 ---
var view = document.getElementById("view");
var fileName = document.getElementById("fileName");

function showMarkdown(text, name) {
  view.innerHTML = render(text);
  fileName.textContent = name || "";
  document.title = (name || "Markdown") + " - Markdown Viewer";
}

function showError(msg) {
  view.innerHTML = '<div id="msg">' + msg + "</div>";
}

function load(path) {
  fetch(path)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    })
    .then(function (b) { showMarkdown(decode(b), path); })
    .catch(function () {
      showError(
        "<b>" + esc(path) + "</b> を読み込めませんでした。<br>" +
        "・IIS 経由で 404 になる場合: IIS は既定で .md を配信しません。web.config の mimeMap を追加するか、md ファイルを .txt にリネームしてください。<br>" +
        "・その他の場合: HTML と同じ場所にファイルがあるか、MD_FILE のパスを確認してください。<br>" +
        "・file:// で直接開いている場合: ブラウザ制限で自動読み込みできません。右上の「MDファイルを開く」からファイルを選んでください。"
      );
    });
}

document.getElementById("openBtn").addEventListener("click", function () {
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { showMarkdown(decode(r.result), f.name); };
  r.readAsArrayBuffer(f);
});

load(MD_FILE);
</script>
</body>
</html>
